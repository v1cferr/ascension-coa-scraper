[project]
name = "ascension-coa-scraper"
version = "0.1.0"
description = "Extract and normalize Project Ascension — Conquest of Azeroth talent trees into a structured JSON dataset."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Victor Ferreira" }]
keywords = ["ascension", "conquest-of-azeroth", "scraper", "talents", "wow"]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Only needed for `--download-assets`, which slices icons out of the sprite sheet.
assets = ["pillow>=10.3"]

[project.scripts]
ascension-coa = "ascension_coa_scraper.cli:main"

[project.urls]
Repository = "https://github.com/v1cferr/ascension-coa-scraper"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ascension_coa_scraper"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
